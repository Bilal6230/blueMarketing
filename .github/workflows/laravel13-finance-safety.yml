name: Laravel 13 finance safety (non-production)

on:
  push:
    branches: [upgrade/laravel-framework]
  pull_request:
    branches: [upgrade/laravel-framework]
  workflow_dispatch:

concurrency:
  group: laravel-finance-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 and isolated SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Verify dependency manifest and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Check installed framework and PHPUnit versions
        run: |
          php -r 'require "vendor/autoload.php"; $f=Composer\InstalledVersions::getPrettyVersion("laravel/framework"); if (!preg_match("/^v?13\./", $f)) {fwrite(STDERR,"Expected Laravel 13, got ".$f.PHP_EOL); exit(1);} echo "Laravel ".$f.PHP_EOL;'
          php -r 'require "vendor/autoload.php"; $v=Composer\InstalledVersions::getPrettyVersion("phpunit/phpunit"); if (!preg_match("/^v?12\./", $v)) {fwrite(STDERR,"Expected PHPUnit 12, got ".$v.PHP_EOL); exit(1);} echo "PHPUnit ".$v.PHP_EOL;'

      - name: Prepare isolated test environment (never migrate production)
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Laravel 13 app boot and route registration smoke checks
        run: |
          php artisan --version
          php artisan about --only=environment
          php artisan route:list --json > /tmp/bluemarketing-routes.json
          php -r '$routes=json_decode(file_get_contents("/tmp/bluemarketing-routes.json"),true,512,JSON_THROW_ON_ERROR); if (!is_array($routes) || count($routes)<10) {fwrite(STDERR,"Unexpectedly empty route registry".PHP_EOL); exit(1);} echo "Registered routes: ".count($routes).PHP_EOL;'

      - name: Laravel modular application discovery (no migrations)
        run: |
          php artisan module:list

      - name: PHP lint changed financial application files
        run: |
          find app/Services/Finance app/Http/Controllers/Finance app/Console/Commands -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Http/Controllers/JournalVoucherController.php
          php -l app/Http/Controllers/CommissionVoucherController.php

      - name: Database V2 isolated schema lint and import planner regression
        run: |
          find database/v2_migrations -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l database/seeders/V2LegacyBanksSeeder.php
          php -l database/v2_migrations/2026_10_30_000020_create_v2_legacy_domain_baseline.php
          php -l app/Services/Finance/V2ModelSchemaContract.php
          php -l tests/Feature/DatabaseV2ModelSchemaContractTest.php
          php -l tests/Feature/DatabaseV2SourceEnumFidelityTest.php
          php -l tests/Feature/DatabaseV2FullLegacyBaselineTest.php
          php -l tests/Feature/DatabaseV2IsolatedFinanceSchemaTest.php
          php -l app/Services/Finance/V2JournalPostingWriter.php
          php -l app/Services/Finance/V2PostingReportReader.php
          php -l app/Services/Finance/FinancialPendingChangeGuard.php
          php -l app/Services/Finance/V2PostingReversalWriter.php
          php -l app/Models/V2/FinancePostingBatch.php
          php -l app/Models/V2/FinancePostingLine.php
          php -l app/Models/V2/FinancePostingSourceClaim.php
          php -l tests/Feature/DatabaseV2PostingModelTest.php
          php -l tools/database_v2/audit_local_temporal_history.php
          php -l tools/database_v2/verify_mysql_v2_model_schema.php
          php -l app/Services/Finance/V2IsolatedConnectionGuard.php
          php -l tests/Feature/Finance/V2IsolatedConnectionGuardTest.php
          php -l app/Services/Finance/V2CashPostingWriter.php
          php -l tests/Feature/Finance/V2CashPostingWriterTest.php
          php -l app/Http/Controllers/Finance/VoucherController.php
          php -l tests/Feature/FinanceApprovalWorkflowTest.php
          php -l app/Http/Controllers/Api/V1/Mobile/MobileApprovalController.php
          php -l tests/Unit/Finance/FinancialPendingChangeGuardTest.php
          php -l tools/database_v2/verify_imported_mysql_financial.php
          php -l tools/database_v2/check_local_v2_target.php
          php -l tools/database_v2/verify_mysql_full_row_digests.php
          php -l tools/database_v2/diagnose_mysql_source_timezone_parity.php
          php -l tools/database_v2/test_mysql_timestamp_timezone_disposable.php
          php -l tools/database_v2/verify_mysql_stock_columns.php
          php -l tools/database_v2/restore_stock_enum_case.php
          php -l tools/database_v2/audit_local_jv_candidate_parity.php
          php tools/database_v2/verify_mysql_stock_columns.php --selftest
          php tools/database_v2/verify_mysql_full_row_digests.php --selftest
          php tools/database_v2/diagnose_mysql_source_timezone_parity.php --selftest
          php artisan test tests/Unit/Finance/V2HistoricalImportTargetGuardTest.php --no-progress
          python3 tools/database_v2/prove_source_export_timezone.py --selftest
          python3 -m py_compile tools/database_v2/prove_source_export_timezone.py
          python3 -m py_compile tools/database_v2/financial_source_fingerprints.py
          python3 -m py_compile tools/database_v2/full_row_digests.py
          python3 -m py_compile tools/database_v2/stock_column_diagnostics.py
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/database_v2/local_private_rehearsal.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/database_v2/check_source_utc_semantics.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          php -l tests/Feature/Finance/V2JournalPostingWriterTest.php
          python3 -m py_compile tools/database_v2/legacy_import_plan.py tools/database_v2/v2_import_plan.py
          python3 -m unittest discover -s tools/database_v2/tests -p 'test_*.py' -v
          php artisan test tests/Feature/DatabaseV2PostingModelTest.php tests/Feature/Finance/V2IsolatedConnectionGuardTest.php tests/Feature/DatabaseV2ModelSchemaContractTest.php tests/Feature/DatabaseV2SourceEnumFidelityTest.php tests/Feature/DatabaseV2FullLegacyBaselineTest.php tests/Feature/DatabaseV2IsolatedFinanceSchemaTest.php tests/Feature/Finance/V2JournalPostingWriterTest.php tests/Feature/Finance/V2CashPostingWriterTest.php
          php artisan test tests/Feature/FinanceApprovalWorkflowTest.php tests/Unit/Finance/FinancialPendingChangeGuardTest.php


      - name: Database V2 broad source/writer static audit (no database)
        run: |
          python3 -m py_compile tools/database_v2/audit_ledger_writers.py
          python3 tools/database_v2/audit_ledger_writers.py --print-limit 350

      - name: End-to-end finance safety regression suite (SQLite in memory)
        run: |
          php artisan test \
            tests/Feature/Finance/JournalVoucherPostingIntegrationTest.php \
            tests/Feature/Finance/CommissionVoucherListingResponseTest.php \
            tests/Feature/Finance/FinancePostingSchemaGateTest.php \
            tests/Feature/Finance/FinancialSourceMetadataIntegrationTest.php \
            tests/Feature/Finance/LegacyEvidenceCoverageIntegrationTest.php \
            tests/Feature/Finance/LegacyEvidenceReleaseGateTest.php \
            tests/Feature/Finance/VoucherSafetyHttpRouteTest.php \
            tests/Feature/Finance/LegacyEvidenceReviewWorksheetTest.php \
            tests/Feature/Finance/LegacyEvidenceApprovalCheckpointTest.php \
            tests/Feature/Finance/LegacyEvidencePortfolioReconciliationTest.php \
            tests/Feature/Finance/JournalVoucherStoreValidationTest.php \
            tests/Feature/Finance/UnsafeVoucherActionGateTest.php \
            tests/Feature/Finance/VoucherGuestAccessIntegrationTest.php \
            tests/Feature/Compatibility/Laravel13RouteContractTest.php

      - name: Laravel 13 cross-module behavioural compatibility (isolated)
        run: |
          php artisan test \
            tests/Unit/BookingPriceCalculatorTest.php \
            tests/Unit/Finance/FinancialPostingFingerprintTest.php \
            tests/Unit/Finance/TypedFinanceFoundationTest.php \
            tests/Unit/Finance/MysqlUniqueIndexPreflightTest.php \
            tests/Unit/Finance/MysqlStagingDatabaseIdentityTest.php \
            tests/Feature/BookingDomainFoundationTest.php \
            tests/Feature/BookingAmendmentIntegrationTest.php \
            tests/Feature/BookingCrossFlowLockingTest.php \
            tests/Feature/BookingCrossFlowStaleWriteTest.php \
            tests/Feature/Api/MobileAuthenticationTest.php \
            tests/Feature/Api/SanctumTokenRegressionTest.php \
            tests/Feature/FinanceApprovalWorkflowTest.php

      - name: Laravel 13 broad operational feature regressions (isolated)
        run: |
          php artisan test \
            tests/Feature/LeadPendingApprovalTest.php \
            tests/Feature/LeadTest.php \
            tests/Feature/AllLeadsReportRenderingTest.php \
            tests/Feature/BookingEditPageTest.php \
            tests/Feature/LabourReportTest.php \
            tests/Feature/LabourViewTest.php \
            tests/Feature/VoucherClearanceFlowTest.php \
            tests/Feature/VoucherDeleteProtectionTest.php \
            tests/Feature/LoginRecaptchaTest.php

      - name: Full Laravel 13 PHPUnit application regression gate (SQLite in memory)
        run: |
          php artisan test

      - name: Check finance migrations are not executed on CI runtime
        if: always()
        run: |
          echo "Only isolated SQLite :memory: tests were run. No production database or deployment credentials configured."


  database-v2-mysql:
    name: Database V2 — disposable MySQL 8.4 migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_not_a_real_password
          MYSQL_DATABASE: bluemarketing_v2_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_not_a_real_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: bluemarketing_v2_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_only_not_a_real_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout V2-only baseline
        uses: actions/checkout@v4

      - name: PHP 8.3 MySQL and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install isolated application dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Assert isolated MySQL database identity before running migrations
        run: |
          php -r '$db=getenv("DB_DATABASE"); if ($db!=="bluemarketing_v2_ci") { fwrite(STDERR,"Refused non-disposable target".PHP_EOL); exit(1); }'
          php artisan migrate:status --path=database/v2_migrations --no-interaction || true

      - name: Apply complete V2-only Laravel schema to fresh disposable MySQL 8.4
        run: |
          php artisan migrate --path=database/v2_migrations --force --no-interaction
          php artisan migrate:status --path=database/v2_migrations --no-interaction

      - name: Seed exact legacy 27-bank V2 lookup on disposable database
        run: php artisan db:seed --class=V2LegacyBanksSeeder --force --no-interaction

      - name: Verify exact V2 FK/identity/integrity constraints in MySQL 8.4
        run: |
          php -l tools/database_v2/verify_mysql_schema.php
          php tools/database_v2/verify_mysql_schema.php
          php tools/database_v2/verify_mysql_v2_model_schema.php
          php tools/database_v2/test_mysql_timestamp_timezone_disposable.php

      - name: Rehearse complete isolated MySQL V2 rollback and clean re-run
        run: |
          php artisan migrate:rollback --path=database/v2_migrations --force --no-interaction
          php artisan migrate --path=database/v2_migrations --force --no-interaction
          php artisan db:seed --class=V2LegacyBanksSeeder --force --no-interaction
          php tools/database_v2/verify_mysql_schema.php
      - name: Reproduce Windows CRLF source staging and prove SHA-safe preflight
        run: |
          python3 tools/database_v2/tests/build_synthetic_mysql_import.py --out=/tmp/v2windows --windows-newlines
          php tools/database_v2/import_staged_mysql.php --dir=/tmp/v2windows --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=2 --ci-synthetic
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/v2windows').glob('*_projects.sql'))
          p.write_bytes(p.read_bytes()+b'UNAUTHORIZED')
          PY
          if php tools/database_v2/import_staged_mysql.php --dir=/tmp/v2windows --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=2 --ci-synthetic; then
            echo "ERROR: changed Windows-staged SQL unexpectedly accepted"
            exit 1
          fi

      - name: Rehearse BAD historical FK import then prove full transaction rollback
        run: |
          python3 tools/database_v2/tests/build_synthetic_mysql_import.py --out=/tmp/v2bad --invalid-fk
          php -l tools/database_v2/import_staged_mysql.php
          php -l app/Services/Finance/V2HistoricalImportTargetGuard.php
          php -l tests/Unit/Finance/V2HistoricalImportTargetGuardTest.php
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/database_v2/verify_new_utc_rehearsal.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          if php tools/database_v2/import_staged_mysql.php --dir=/tmp/v2bad --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=3; then
            echo "ERROR: synthetic fixture accepted without CI-only authorization"
            exit 1
          fi
          if php tools/database_v2/import_staged_mysql.php --dir=/tmp/v2bad --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=3 --ci-synthetic --apply; then
            echo "ERROR: invalid FK unexpectedly imported"
            exit 1
          fi
          php -r '
          require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          if (Illuminate\Support\Facades\DB::table("projects")->count()!==0) { throw new RuntimeException("Rollback leaked project row"); }
          if (Illuminate\Support\Facades\DB::table("legacy_migration_history")->count()!==0) { throw new RuntimeException("Rollback leaked history row"); }
          '

      - name: Rehearse SUCCESSFUL fake 57-table V2 import with timestamps, PK and historical migration archive
        run: |
          python3 tools/database_v2/tests/build_synthetic_mysql_import.py --out=/tmp/v2good --zero-id
          php tools/database_v2/import_staged_mysql.php --dir=/tmp/v2good --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=4 --ci-synthetic --ci-simulated-timezone --apply
          php tools/database_v2/verify_imported_mysql_financial.php --manifest=/tmp/v2good/manifest.json --source-evidence=/tmp/v2good/fake_source_fingerprints.json --expected-sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --expected-rows=4
          php -r '
          require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=Illuminate\Support\Facades\DB::connection();
          $db->statement("SET SESSION time_zone = ?", ["+00:00"]);
          $p=$db->table("projects")->where("id",99999)->first();
          if (!$p || $p->created_at!=="2020-02-03 04:05:06" || $p->updated_at!=="2020-04-05 06:07:08" || $p->address!=="synthetic; address") { throw new RuntimeException("Original synthetic IDs/timestamps/text were not preserved"); }
          if ((int)$db->table("legacy_migration_history")->where("id",42)->count()!==1 || (int)$db->table("migrations")->count()!==3) { throw new RuntimeException("Legacy migration history was not safely archived"); }
          $ids=$db->table("account_types")->orderBy("id")->pluck("id")->map(fn ($x)=>(int)$x)->all();
          if ($ids!==[0,1]) { throw new RuntimeException("Historical source auto-increment primary IDs 0 and 1 changed"); }
          echo "V2 synthetic historical import PASS: 57 tables, 2 source rows, exact ID/timestamps, FK rollback".PHP_EOL;
          '
