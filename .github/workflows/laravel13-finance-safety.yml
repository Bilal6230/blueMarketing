name: Laravel 13 finance safety (non-production)

on:
  push:
    branches: [upgrade/laravel-framework]
  pull_request:
    branches: [upgrade/laravel-framework]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 and isolated SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Verify dependency manifest and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Check installed framework and PHPUnit versions
        run: |
          php -r 'require "vendor/autoload.php"; $f=Composer\InstalledVersions::getPrettyVersion("laravel/framework"); if (!preg_match("/^v?13\./", $f)) {fwrite(STDERR,"Expected Laravel 13, got ".$f.PHP_EOL); exit(1);} echo "Laravel ".$f.PHP_EOL;'
          php -r 'require "vendor/autoload.php"; $v=Composer\InstalledVersions::getPrettyVersion("phpunit/phpunit"); if (!preg_match("/^v?12\./", $v)) {fwrite(STDERR,"Expected PHPUnit 12, got ".$v.PHP_EOL); exit(1);} echo "PHPUnit ".$v.PHP_EOL;'

      - name: Prepare isolated test environment (never migrate production)
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Laravel 13 app boot and route registration smoke checks
        run: |
          php artisan --version
          php artisan about --only=environment
          php artisan route:list --json > /tmp/bluemarketing-routes.json
          php -r '$routes=json_decode(file_get_contents("/tmp/bluemarketing-routes.json"),true,512,JSON_THROW_ON_ERROR); if (!is_array($routes) || count($routes)<10) {fwrite(STDERR,"Unexpectedly empty route registry".PHP_EOL); exit(1);} echo "Registered routes: ".count($routes).PHP_EOL;'

      - name: Laravel modular application discovery (no migrations)
        run: |
          php artisan module:list

      - name: PHP lint changed financial application files
        run: |
          find app/Services/Finance app/Http/Controllers/Finance app/Console/Commands -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Http/Controllers/JournalVoucherController.php
          php -l app/Http/Controllers/CommissionVoucherController.php

      - name: Database V2 isolated schema lint and import planner regression
        run: |
          find database/v2_migrations -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l database/seeders/V2LegacyBanksSeeder.php
          php -l database/v2_migrations/2026_10_30_000020_create_v2_legacy_domain_baseline.php
          php -l tests/Feature/DatabaseV2FullLegacyBaselineTest.php
          php -l tests/Feature/DatabaseV2IsolatedFinanceSchemaTest.php
          php -l app/Services/Finance/V2JournalPostingWriter.php
          php -l tests/Feature/Finance/V2JournalPostingWriterTest.php
          python3 -m py_compile tools/database_v2/legacy_import_plan.py tools/database_v2/v2_import_plan.py
          python3 -m unittest discover -s tools/database_v2/tests -p 'test_*.py' -v
          php artisan test tests/Feature/DatabaseV2FullLegacyBaselineTest.php tests/Feature/DatabaseV2IsolatedFinanceSchemaTest.php tests/Feature/Finance/V2JournalPostingWriterTest.php


      - name: End-to-end finance safety regression suite (SQLite in memory)
        run: |
          php artisan test \
            tests/Feature/Finance/JournalVoucherPostingIntegrationTest.php \
            tests/Feature/Finance/CommissionVoucherListingResponseTest.php \
            tests/Feature/Finance/FinancePostingSchemaGateTest.php \
            tests/Feature/Finance/FinancialSourceMetadataIntegrationTest.php \
            tests/Feature/Finance/LegacyEvidenceCoverageIntegrationTest.php \
            tests/Feature/Finance/LegacyEvidenceReleaseGateTest.php \
            tests/Feature/Finance/VoucherSafetyHttpRouteTest.php \
            tests/Feature/Finance/LegacyEvidenceReviewWorksheetTest.php \
            tests/Feature/Finance/LegacyEvidenceApprovalCheckpointTest.php \
            tests/Feature/Finance/LegacyEvidencePortfolioReconciliationTest.php \
            tests/Feature/Finance/JournalVoucherStoreValidationTest.php \
            tests/Feature/Finance/UnsafeVoucherActionGateTest.php \
            tests/Feature/Finance/VoucherGuestAccessIntegrationTest.php \
            tests/Feature/Compatibility/Laravel13RouteContractTest.php

      - name: Laravel 13 cross-module behavioural compatibility (isolated)
        run: |
          php artisan test \
            tests/Unit/BookingPriceCalculatorTest.php \
            tests/Unit/Finance/FinancialPostingFingerprintTest.php \
            tests/Unit/Finance/TypedFinanceFoundationTest.php \
            tests/Unit/Finance/MysqlUniqueIndexPreflightTest.php \
            tests/Unit/Finance/MysqlStagingDatabaseIdentityTest.php \
            tests/Feature/BookingDomainFoundationTest.php \
            tests/Feature/BookingAmendmentIntegrationTest.php \
            tests/Feature/BookingCrossFlowLockingTest.php \
            tests/Feature/BookingCrossFlowStaleWriteTest.php \
            tests/Feature/Api/MobileAuthenticationTest.php \
            tests/Feature/Api/SanctumTokenRegressionTest.php \
            tests/Feature/FinanceApprovalWorkflowTest.php

      - name: Laravel 13 broad operational feature regressions (isolated)
        run: |
          php artisan test \
            tests/Feature/LeadPendingApprovalTest.php \
            tests/Feature/LeadTest.php \
            tests/Feature/AllLeadsReportRenderingTest.php \
            tests/Feature/BookingEditPageTest.php \
            tests/Feature/LabourReportTest.php \
            tests/Feature/LabourViewTest.php \
            tests/Feature/VoucherClearanceFlowTest.php \
            tests/Feature/VoucherDeleteProtectionTest.php \
            tests/Feature/LoginRecaptchaTest.php

      - name: Full Laravel 13 PHPUnit application regression gate (SQLite in memory)
        run: |
          php artisan test

      - name: Check finance migrations are not executed on CI runtime
        if: always()
        run: |
          echo "Only isolated SQLite :memory: tests were run. No production database or deployment credentials configured."


  database-v2-mysql:
    name: Database V2 — disposable MySQL 8.4 migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_not_a_real_password
          MYSQL_DATABASE: bluemarketing_v2_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_not_a_real_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: bluemarketing_v2_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_only_not_a_real_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout V2-only baseline
        uses: actions/checkout@v4

      - name: PHP 8.3 MySQL and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install isolated application dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Assert isolated MySQL database identity before running migrations
        run: |
          php -r '$db=getenv("DB_DATABASE"); if ($db!=="bluemarketing_v2_ci") { fwrite(STDERR,"Refused non-disposable target".PHP_EOL); exit(1); }'
          php artisan migrate:status --path=database/v2_migrations --no-interaction || true

      - name: Apply complete V2-only Laravel schema to fresh disposable MySQL 8.4
        run: |
          php artisan migrate --path=database/v2_migrations --force --no-interaction
          php artisan migrate:status --path=database/v2_migrations --no-interaction

      - name: Seed exact legacy 27-bank V2 lookup on disposable database
        run: php artisan db:seed --class=V2LegacyBanksSeeder --force --no-interaction

      - name: Verify exact V2 FK/identity/integrity constraints in MySQL 8.4
        run: |
          php -l tools/database_v2/verify_mysql_schema.php
          php tools/database_v2/verify_mysql_schema.php

      - name: Rehearse complete isolated MySQL V2 rollback and clean re-run
        run: |
          php artisan migrate:rollback --path=database/v2_migrations --force --no-interaction
          php artisan migrate --path=database/v2_migrations --force --no-interaction
          php artisan db:seed --class=V2LegacyBanksSeeder --force --no-interaction
          php tools/database_v2/verify_mysql_schema.php
